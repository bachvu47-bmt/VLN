name: Cào tri thức nhà sản xuất

# Sitemap Sika / Jotun / Maxbond → trang mới hoặc đổi nội dung → Groq tóm tắt
# thành thẻ tri thức → nhánh "tri-thuc" (tri-thuc-moi.json). App Admin nhận thẻ vào
# hàng chờ duyệt; duyệt xong Maika mới học (HITL).
# Lịch: 2 lần/ngày — 5:30 và 12:30 giờ VN (22:30 và 5:30 UTC).
on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      gioi_han:
        description: 'Số trang tối đa mỗi nguồn trong lần chạy này'
        default: '8'

permissions:
  contents: write

concurrency:
  group: tri-thuc-sync
  cancel-in-progress: false

jobs:
  cao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lấy trạng thái lần chạy trước (nếu có)
        run: |
          mkdir -p /tmp/tri-thuc
          for f in trang-thai.json tri-thuc-moi.json; do
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/tri-thuc/$f" -o "/tmp/tri-thuc/$f" || rm -f "/tmp/tri-thuc/$f"
          done

      - name: Cào & tóm tắt
        env:
          GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          GIOI_HAN_MOI_NGUON: ${{ github.event.inputs.gioi_han || '8' }}
        run: node scripts/cao-tri-thuc.mjs /tmp/tri-thuc

      - name: Đăng lên nhánh tri-thuc (1 commit duy nhất)
        working-directory: /tmp/tri-thuc
        run: |
          git init -q -b tri-thuc
          git config user.name "maika-tri-thuc"
          git config user.email "actions@users.noreply.github.com"
          git add trang-thai.json tri-thuc-moi.json
          git commit -q -m "Tri thức $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tri-thuc
