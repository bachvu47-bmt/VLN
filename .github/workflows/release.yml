name: Build & Release

# Tự động build + publish khi push tag dạng v* (vd: v1.1.0)
# QUAN TRỌNG: 2 job build chỉ CẤT file (artifact); job "phat-hanh" chạy SAU CÙNG mới
# tạo Release với ĐỦ .apk + .exe + latest.yml. Trước đây mỗi job tự tạo Release →
# job Windows xong trước tạo Release thiếu .apk → app Android báo "Không có link .apk".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------- Android (.apk) ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cài dependencies
        run: npm ci

      - name: Build web + đồng bộ Android
        # Key Gemini nhúng vào bundle lúc build (.env.local không có trên CI)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-flash-latest
          VITE_GEMINI_EMBED_MODEL: gemini-embedding-001
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_SHEET_BAO_CAO_ID: ${{ secrets.VITE_SHEET_BAO_CAO_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Khôi phục keystore từ secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/vatlieunha-release.p12

      - name: Build APK (release — đã ký chính thức)
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/app/vatlieunha-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Đổi tên APK theo phiên bản
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "VatLieuNha-Sales-${GITHUB_REF_NAME}.apk"

      - name: Cất APK chờ phát hành
        uses: actions/upload-artifact@v4
        with:
          name: ban-android
          path: VatLieuNha-Sales-*.apk
          if-no-files-found: error
          retention-days: 3

  # ---------- Windows (.exe) + electron-updater ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build web (dist/ không có trên git)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-flash-latest
          VITE_GEMINI_EMBED_MODEL: gemini-embedding-001
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_SHEET_BAO_CAO_ID: ${{ secrets.VITE_SHEET_BAO_CAO_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Build .exe (không tự publish)
        run: npx electron-builder --win --x64 --publish never

      - name: Cất .exe + latest.yml chờ phát hành
        # latest.yml bắt buộc phải nằm trong Release để electron-updater auto-update hoạt động
        uses: actions/upload-artifact@v4
        with:
          name: ban-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 3

  # ---------- Phát hành: chỉ khi CẢ HAI bản build đều thành công ----------
  phat-hanh:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ban-phat-hanh
          merge-multiple: true

      - name: Kiểm tra đủ file trước khi phát hành
        working-directory: ban-phat-hanh
        run: |
          ls -la
          test -n "$(ls VatLieuNha-Sales-*.apk 2>/dev/null)" || { echo "THIẾU .apk"; exit 1; }
          test -n "$(ls *Setup*.exe 2>/dev/null)" || { echo "THIẾU .exe"; exit 1; }
          test -f latest.yml || { echo "THIẾU latest.yml"; exit 1; }

      - name: Tạo GitHub Release với đủ .apk + .exe + latest.yml cùng lúc
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ban-phat-hanh/*.apk
            ban-phat-hanh/*.exe
            ban-phat-hanh/*.exe.blockmap
            ban-phat-hanh/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
