name: Build & Release

# Tự động build + publish khi push tag dạng v* (vd: v1.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------- Android (.apk) ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cài dependencies
        run: npm ci

      - name: Build web + đồng bộ Android
        # Key Gemini nhúng vào bundle lúc build (.env.local không có trên CI)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-flash-latest
          VITE_GEMINI_EMBED_MODEL: gemini-embedding-001
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Khôi phục keystore từ secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/vatlieunha-release.p12

      - name: Build APK (release — đã ký chính thức)
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/app/vatlieunha-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Đổi tên APK theo phiên bản
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "VatLieuNha-Sales-${GITHUB_REF_NAME}.apk"

      - name: Đính APK vào GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: VatLieuNha-Sales-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ---------- Windows (.exe) + electron-updater ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build web (dist/ không có trên git)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: gemini-flash-latest
          VITE_GEMINI_EMBED_MODEL: gemini-embedding-001
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Build .exe (không tự publish)
        run: npx electron-builder --win --x64 --publish never

      - name: Đính .exe + latest.yml vào GitHub Release
        # latest.yml bắt buộc phải nằm trong Release để electron-updater auto-update hoạt động
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
