name: Build & Release

# Tự động build + publish khi push tag dạng v* (vd: v1.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------- Android (.apk) ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài dependencies
        run: npm ci

      - name: Build web + đồng bộ Android
        run: |
          npm run build
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Build APK (debug — tự ký, cài được ngay)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Đổi tên APK theo phiên bản
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "VatLieuNha-Sales-${GITHUB_REF_NAME}.apk"

      - name: Đính APK vào GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: VatLieuNha-Sales-*.apk
          fail_on_unmatched_files: true

  # ---------- Windows (.exe) + electron-updater ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build .exe (không tự publish)
        run: npx electron-builder --win --x64 --publish never

      - name: Đính .exe + latest.yml vào GitHub Release
        # latest.yml bắt buộc phải nằm trong Release để electron-updater auto-update hoạt động
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
